<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Calculator Program | Project</title>
    <!-- <link rel="stylesheet" href="g1.css" /> -->
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="box">
      <h1>Student Grade Calculator</h1>

      <form onsubmit="showGrade(event)" onreset="clearResult()">
        <div class="all-input">
          <label for="userName">Name: </label>
          <input
            type="text"
            name="userName"
            id="userName"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="all-input">
          <label for="userRollNo">Roll No: </label>
          <input
            type="number"
            name="userRollNo"
            id="userRollNo"
            placeholder="Enter your roll no"
            required
          />
        </div>

        <div class="all-input">
          <label for="englishMarks">English Marks: </label>
          <input
            type="number"
            name="englishMarks"
            id="englishMarks"
            min="0"
            max="100"
            placeholder="Enter your marks here"
            required
          />
        </div>
        <div class="all-input">
          <label for="mathMarks">Math Marks: </label>
          <input
            type="number"
            name="mathMarks"
            id="mathMarks"
            min="0"
            max="100"
            placeholder="Enter your marks here"
            required
          />
        </div>
        <div class="all-input">
          <label for="computerMarks">Computer Marks: </label>
          <input
            type="number"
            name="computerMarks"
            id="computerMarks"
            min="0"
            max="100"
            placeholder="Enter your marks here"
            required
          />
        </div>

        <div id="btns">
          <button type="submit" id="submitBtn">Show Result</button>
          <button type="reset" id="resetBtn">Clear All</button>
        </div>
      </form>

      <div id="resultBox" class="result-box hidden"></div>

      <!-- <p id="p1"></p> -->
    </div>
    <script src="main.js"></script>
    <!-- <script src="g1.js"></script> -->
  </body>
</html>
