<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="1.css" />
  </head>
  <body>
    <div id="box">
      <h1>Grade Calculator</h1>

      <form onsubmit="calculateGrade(event)">
        <!-- Name -->
        <div class="inp-label">
          <label for="username">Name:</label>
          <input
            type="text"
            id="username"
            placeholder="Enter your name"
            required
          />
        </div>

        <!-- Roll No -->
        <div class="inp-label">
          <label for="userrollno">Roll No:</label>
          <input
            type="number"
            id="userrollno"
            placeholder="e.g. 24"
            min="0"
            required
          />
        </div>

        <!-- English Marks -->
        <div class="inp-label">
          <label for="engmarks">English Marks (out of 100):</label>
          <input
            type="number"
            id="engmarks"
            placeholder="e.g. 75"
            min="0"
            max="100"
            required
          />
        </div>
        <!-- Math Marks -->
        <div class="inp-label">
          <label for="mathmarks">Math Marks (out of 100):</label>
          <input
            type="number"
            id="mathmarks"
            placeholder="e.g. 85"
            min="0"
            max="100"
            required
          />
        </div>

        <!-- Computer Marks -->
        <div class="inp-label">
          <label for="compmarks">Computer Marks (out of 100):</label>
          <input
            type="number"
            id="compmarks"
            placeholder="e.g. 95"
            min="0"
            max="100"
            required
          />
        </div>

        <button type="submit">Check Result</button>
      </form>

      <div id="result"></div>
    </div>

    <script src="1.js"></script>
  </body>
</html>
