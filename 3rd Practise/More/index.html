<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="box">
      <h1>Grade Calculator</h1>

      <form onsubmit="calculateGrade(event)">
        <!-- Name -->
        <div class="inp-label">
          <label for="userName">Name:</label>
          <input type="text" id="userName" placeholder="e.g. Ahmad" required />
        </div>
        <!-- Roll No -->
        <div class="inp-label">
          <label for="userRollNo">Roll No:</label>
          <input type="number" id="userRollNo" placeholder="e.g. 12" required />
        </div>
        <!-- Eng Marks -->
        <div class="inp-label">
          <label for="engMarks">English Marks (out of 100):</label>
          <input
            type="number"
            id="engMarks"
            min="0"
            max="100"
            placeholder="e.g. 75"
            required
          />
        </div>
        <!-- Math Marks -->
        <div class="inp-label">
          <label for="mathMarks">Math Marks (out of 100):</label>
          <input
            type="number"
            id="mathMarks"
            min="0"
            max="100"
            placeholder="e.g. 85"
            required
          />
        </div>
        <!-- Computer Marks -->
        <div class="inp-label">
          <label for="compMarks">Computer Marks (out of 100):</label>
          <input
            type="number"
            id="compMarks"
            min="0"
            max="100"
            placeholder="e.g. 95"
            required
          />
        </div>

        <!-- Button -->
        <button type="submit">Calculate Grade</button>
      </form>

      <!-- Result -->
      <p id="result"></p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
